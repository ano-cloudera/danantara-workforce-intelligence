project:
  name: Cloudera Workforce Intelligence PoC (codename Danantara)
  phase: implementation-ready
  readiness_percent: 95
  runtime: Cloudera AI Workbench Applications
delivery_method:
  selector: skills/delivery-method-selector/SKILL.md
  default: lightest-safe-method
  modes:
    direct: bounded-maintenance-and-fixes
    spec_kit: medium-well-defined-features
    bmad: material-business-architecture-or-cross-platform-change
architecture:
  applications:
    - frontend
    - backend
    - qdrant
    - observability
  cai_runtime:
    bind_host: 127.0.0.1
    port_precedence:
      - CDSW_APP_PORT
      - PORT
      - local-development-default
    inter_application_urls:
      frontend_to_backend: BACKEND_BASE_URL
      backend_to_qdrant: QDRANT_BASE_URL
      backend_to_observability: OBSERVABILITY_BASE_URL
  orchestrator: crewai-flows
  llm_provider: gemini
  llm_sdk: google-genai
  vector_store: qdrant
  qdrant_backend_transport: rest-httpx
  qdrant_workload_isolation:
    nifi_demo: QDRANT_NIFI_COLLECTION
    workforce_candidates: QDRANT_CANDIDATE_COLLECTION
    workforce_policies: QDRANT_POLICY_COLLECTION
  local_data_roots:
    nifi_demo: data/nifi-demo
    workforce_app: data/workforce-app
  app_state: sqlite
  structured_data: cloudera-data-warehouse-impala
  transformation: cloudera-data-engineering
  cai_cv_ingestion_fallback: jobs/cv_ingestion/run_cai_job.py
  cai_policy_ingestion_fallback: jobs/policy_ingestion/run_cai_job.py
  cai_cv_storage_access:
    governed: idbroker-ranger-s3a
    local_fallback: boto3
  dashboard: cloudera-data-visualization
  frontend_experience: responsive-six-page-enterprise-shell
  frontend_icons: lucide-react-named-imports
  frontend_global_search: grouped-responsive-search
  policy_experience: citation-first-multi-turn-workspace
  local_sample_importer: apps/backend/scripts/import_sample_data.py
  guardrails: builtin-with-guardrails-ai-extension
  observability: local-gateway-with-optional-langfuse
locked_decisions:
  - Agent Studio is showcase-only for this PoC runtime; the agent-studio/ workflow export and its
    three tool templates (talent_intelligence_tool, policy_intelligence_tool, governance_tools)
    document the same capabilities as an Agent Studio hierarchical workflow but are not deployed or
    executed — the CrewAI Flow backend remains the primary runtime.
  - The frontend is rebranded as Cloudera Workforce Intelligence (official cloudera-logo.png mark).
    The design-token hierarchy has purple/violet driving selection/active state (sidebar, tabs,
    filters, focus, secondary buttons) and orange reserved for primary CTAs, notifications, and
    ranking emphasis only; navy stays for headings/structure. Responsive grid tracks use
    minmax(0, ...) instead of bare 1fr/auto to avoid overflow at high browser zoom (commits
    0b55f8b, d3ed8bf). Visual/CSS only, no backend or business-logic change.
  - No LangChain in baseline.
  - SQLite is not enterprise system-of-record.
  - Gemini text and embeddings are configurable.
  - Guardrails execute before and after AI workflow.
  - Shared Qdrant workloads use unique environment-configured collections, not folder isolation.
  - Backend-to-Qdrant operations use REST through httpx for CAI Istio/Envoy compatibility.
  - CAI Applications use CDSW_APP_PORT and CAI-assigned service URLs; exposed ports are not fixed.
  - BMAD is used selectively; existing BMAD artifacts do not force all changes through BMAD.
  - Policy conversation and feedback are Application state; policy documents and structured HR data remain governed sources.
  - The scheduled CAI CV ingestion Job is a PoC fallback, not a fifth Application or a replacement for NiFi/CDE.
  - The CAI CV Job uses governed Hadoop/S3A access in Workbench; boto3 is only a local or scoped-role fallback.
  - CV entity normalization is shared across Impala and Qdrant; explicit values win and CAND entity codes are the deterministic fallback.
  - Backend and CAI Job Impala clients share configurable HTTP transport and HTTP path settings for CDW port 443.
  - The CAI policy Job is a governed PDF/DOCX/XLSX PoC fallback with review routing, Iceberg metadata/audit, stable Qdrant replacement, and no fifth Application.
  - Dynamic policy downloads use IDBroker/Ranger S3A access and do not expose governed S3 URIs.
  - The policy Job's Gemini embedding call embeds chunks one at a time rather than batching, so the
    vector-to-chunk count always matches by construction (batching risked returning fewer
    embeddings than chunks on multi-chunk documents, tripping the embedding_count_mismatch
    guardrail; fixed in commit f3574ae).
  - The backend Application requires its own POLICY_SOURCE_ACCESS_MODE=datalake plus Ranger read
    access to policy-processed/ and policy-review/, separate from the policy Job's S3_ACCESS_MODE;
    without it, citation downloads 404 even though ingestion succeeded.
  - policy_query logs the full traceback server-side and returns a 502 with request_id and error
    detail on internal failure instead of a bare 500 (commit 4e2a0b1).
  - GET /dashboard/summary reads recruitment-pipeline stage/status/match-score/salary-compliance
    data from danantara.v_recruitment_pipeline_api when DATA_MODE=impala, falling back to the demo
    recruitment_status.json fixture if the table is empty or unreachable. No ingestion Job populates
    this table yet; it is a PoC placeholder pending an ATS/HRIS source.
  - The Data Sources upload form supports UPLOAD_ACCESS_MODE=datalake: uploads land directly in the
    governed S3A CV/policy landing prefixes (S3_CV_LANDING_URI, S3_POLICY_LANDING_URI) via
    `hadoop fs -put`, so upload -> CAI Job -> Impala/Qdrant is one real loop instead of the old
    local-filesystem-plus-direct-Qdrant-index path. Local mode remains the default.
  - Policy Intelligence routes questions through two Gemini classifiers before PolicyRAGFlow: one
    for small talk (answered directly, no retrieval/citations) and one for a whitelisted data-query
    tool (candidate_count, candidates_over_time, recruitment_stage_breakdown,
    open_positions_summary) that Gemini can only select by a fixed ID, never by writing SQL.
  - Guardrails block chat requests for an individual's personal contact/compensation details
    (English and Indonesian), as a second layer on top of DataGateway never selecting PII columns.
  - AI-generated chat/reasoning text renders through a dependency-free markdown renderer instead of
    showing raw ** / * characters; the PDF export strips the same tokens since it has no font
    styling to express emphasis with.
  - Policy Intelligence's entity Source filters are optional: an empty selection searches every
    entity, matching PolicyRAGFlow.retrieve()'s existing server-side behavior. The frontend
    previously required at least one checked entity, which was stricter than the backend needs and
    caused newly ingested documents (entity not pre-checked by default) to silently vanish from
    answers until the user noticed.
