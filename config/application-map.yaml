applications:
  frontend:
    entrypoint: apps/frontend/run_cai.py
    depends_on: [backend]
    service_urls:
      backend: BACKEND_BASE_URL
  backend:
    entrypoint: apps/backend/run_cai.py
    depends_on: [qdrant, observability, gemini, cdw]
    service_urls:
      qdrant: QDRANT_BASE_URL
      observability: OBSERVABILITY_BASE_URL
  qdrant:
    entrypoint: apps/qdrant/run_cai.py
    depends_on: []
  observability:
    entrypoint: apps/observability/run_cai.py
    depends_on: [langfuse_optional]
platform_services:
  ingestion: Cloudera DataFlow / NiFi
  transformation: Cloudera Data Engineering
  structured_serving: Cloudera Data Warehouse / Impala
  management_analytics: Cloudera Data Visualization
  governance: Cloudera SDX / Ranger / Atlas
platform_jobs:
  cv_ingestion_poc_fallback:
    entrypoint: jobs/cv_ingestion/run_cai_job.py
    depends_on: [s3, gemini, cdw, qdrant, observability]
    topology_effect: none
  policy_ingestion_poc_fallback:
    entrypoint: jobs/policy_ingestion/run_cai_job.py
    depends_on: [s3, gemini, cdw, qdrant, observability]
    topology_effect: none
cai_runtime:
  bind_host: 127.0.0.1
  port_precedence: [CDSW_APP_PORT, PORT, local_default]
